name: Deploy to GitHub Pages

on:
  # Only deploy after security pipeline passes on main
  workflow_run:
    workflows: ["Security Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if security pipeline succeeded (or manual dispatch)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Block deploy if secrets detected
        run: |
          PATTERNS='AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{48}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*['"'"'""][^'"'"'""]+['"'"'""]'
          if grep -rEI "$PATTERNS" --include='*.js' --include='*.json' --include='*.html' --include='*.yml' . 2>/dev/null | grep -v node_modules | grep -v '.github/workflows'; then
            echo "::error::Secrets detected in committed files — blocking deploy"
            exit 1
          fi
          echo "No secrets detected"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
