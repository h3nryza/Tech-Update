name: Collect Tech News (Manual / Fallback)

# Daily collection is handled by AWS Lambda (lambda/handler.js).
# This workflow is kept as a manual fallback and for local testing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: cd scripts && npm ci

      - name: Audit dependencies (blocking)
        run: cd scripts && npm audit --audit-level=high

      - name: Parse sources from feeds.md
        run: cd scripts && node parse-sources.js

      - name: Collect news
        run: cd scripts && node collect.js

      - name: Build search index
        run: cd scripts && node build.js

      - name: Run test suite
        run: cd scripts && node test-feeds.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily news collection $(date -u +%Y-%m-%d)"
            git push
          fi
