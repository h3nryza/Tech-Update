name: Collect Tech News

on:
  schedule:
    # 6am SAST = 4am UTC daily
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: cd scripts && npm ci

      - name: Audit dependencies (blocking)
        run: cd scripts && npm audit --audit-level=high

      - name: Parse sources from feeds.md
        run: cd scripts && node parse-sources.js

      - name: Collect news
        run: cd scripts && node collect.js

      - name: Build search index
        run: cd scripts && node build.js

      - name: Validate data integrity
        run: |
          node -e "
            const fs = require('fs');
            const news = JSON.parse(fs.readFileSync('data/news.json'));
            const sources = JSON.parse(fs.readFileSync('data/sources.json'));
            console.log('News items:', news.items.length);
            console.log('Sources:', sources.sources.length);
            let issues = 0;
            news.items.forEach(function(item, i) {
              if (!item.id) { console.log('Missing id at index', i); issues++; }
              if (!item.title) { console.log('Missing title at index', i); issues++; }
              if (!item.url) { console.log('Missing url at index', i); issues++; }
            });
            if (issues > 0) { console.error(issues + ' data issues found'); process.exit(1); }
            console.log('All items valid');
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily news collection $(date -u +%Y-%m-%d)"
            git push
          fi
