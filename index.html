<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Update — Weekly Report</title>
  <meta name="description" content="Aggregated tech news across products and topics, updated weekly.">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
        },
      },
    };
  </script>

  <!-- jsPDF + AutoTable for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>

  <!-- App JS (must load before Alpine) -->
  <script src="js/tabs.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/search.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>

  <!-- Alpine.js collapse plugin + core -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.8/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors">

<div x-data="app()" x-cloak class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50">
    <div class="mx-auto px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <!-- Sidebar toggle -->
          <button @click="sidebarOpen = !sidebarOpen"
                  class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                  title="Toggle sidebar">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <h1 class="text-xl md:text-2xl font-bold tracking-tight">
            <span class="text-blue-600 dark:text-blue-400">Tech</span> Update
          </h1>
          <span class="hidden sm:inline text-xs text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-full">Weekly Report</span>
          <span class="text-sm font-medium text-gray-700 dark:text-gray-300 bg-blue-50 dark:bg-blue-900/30 px-2.5 py-1 rounded-lg"
                x-text="activeTabDef.icon + ' ' + activeTabDef.label"></span>
        </div>
        <div class="flex items-center gap-2">
          <span x-show="lastUpdated" class="hidden md:inline text-[10px] text-gray-400 dark:text-gray-500"
                x-text="'Updated: ' + new Date(lastUpdated).toLocaleString('en-ZA', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})"></span>
          <span class="hidden md:inline text-xs text-gray-500 dark:text-gray-400" x-text="dateRangeDisplay"></span>
          <span class="text-xs font-medium bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 px-2 py-1 rounded-full"
                x-text="filteredItems.length + ' items'"></span>
          <button @click="doToggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
            <span x-show="theme === 'light'" class="text-lg">🌙</span>
            <span x-show="theme === 'dark'" class="text-lg">☀️</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Search & Filters Bar -->
  <div class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
    <div class="mx-auto px-4 py-3">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1 relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text"
                 :value="searchQuery"
                 @input="onSearchInput($event)"
                 @keydown.escape="searchQuery = ''"
                 :placeholder="globalSearch ? 'Search all tabs... (words, dates, #tags)' : 'Search ' + activeTabDef.label + '... (words, dates like 2026-03, #tags)'"
                 class="w-full pl-10 pr-20 py-2 text-sm border border-gray-300 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-colors">
          <button @click="toggleGlobalSearch()"
                  :class="globalSearch ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400'"
                  class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 text-[10px] font-semibold rounded transition-colors"
                  title="Toggle global search">
            GLOBAL
          </button>
        </div>
        <div class="flex items-center gap-1.5 flex-wrap">
          <template x-for="p in [{id:'all',label:'All'},{id:'today',label:'Today'},{id:'yesterday',label:'Yesterday'},{id:'this-week',label:'This Week'},{id:'last-week',label:'Last Week'},{id:'last-30',label:'30d'},{id:'last-90',label:'90d'}]">
            <button @click="setDatePreset(p.id)"
                    :class="datePreset === p.id ? 'bg-blue-500 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700'"
                    class="px-3 py-1.5 text-xs font-medium rounded-lg transition-colors"
                    x-text="p.label"></button>
          </template>
          <button @click="showFilters = !showFilters"
                  class="px-3 py-1.5 text-xs font-medium rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
            Custom
          </button>
        </div>
      </div>
      <div x-show="showFilters" x-transition class="mt-3 flex items-center gap-3">
        <label class="text-xs text-gray-500">From:</label>
        <input type="date" x-model="dateStart" class="text-sm border border-gray-300 dark:border-gray-700 rounded-lg px-2 py-1 bg-gray-50 dark:bg-gray-800 outline-none">
        <label class="text-xs text-gray-500">To:</label>
        <input type="date" x-model="dateEnd" class="text-sm border border-gray-300 dark:border-gray-700 rounded-lg px-2 py-1 bg-gray-50 dark:bg-gray-800 outline-none">
        <button @click="dateStart = ''; dateEnd = ''; datePreset = ''" class="text-xs text-red-500 hover:text-red-700">Clear</button>
      </div>

      <!-- Quick Tag Pills -->
      <div class="mt-3 flex items-center gap-2 flex-wrap">
        <span class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mr-1">Tags:</span>
        <template x-for="t in allTagsWithCounts" :key="t.tag">
          <button @click="toggleTagInSearch(t.tag)"
                  :class="isTagActive(t.tag)
                    ? (getTagStyle(t.tag).bg + ' ' + getTagStyle(t.tag).text + ' ring-2 ring-blue-500')
                    : (getTagStyle(t.tag).bg + ' ' + getTagStyle(t.tag).text + ' opacity-70 hover:opacity-100')"
                  class="inline-flex items-center gap-1 px-2 py-1 text-[10px] font-medium rounded-full transition-all cursor-pointer">
            <span x-text="getTagStyle(t.tag).emoji + ' ' + t.tag"></span>
            <span class="bg-black/10 dark:bg-white/10 px-1 rounded-full text-[9px]" x-text="t.count"></span>
          </button>
        </template>
        <div class="ml-auto flex items-center gap-1.5">
          <button @click="toggleColumnFilters()"
                  :class="showColumnFilters || columnFilters.length > 0 ? 'bg-purple-500 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400'"
                  class="px-3 py-1 text-[10px] font-bold rounded-lg transition-colors uppercase tracking-wider">
            Filters
            <span x-show="columnFilters.length > 0 && !showColumnFilters" class="ml-1" x-text="'(' + columnFilters.length + ')'"></span>
          </button>
          <button @click="toggleAdvanced()"
                  :class="showAdvanced ? 'bg-blue-500 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400'"
                  class="px-3 py-1 text-[10px] font-bold rounded-lg transition-colors uppercase tracking-wider">
            Advanced
          </button>
        </div>
      </div>

      <!-- Column Include/Exclude Filters -->
      <div x-show="showColumnFilters" x-transition class="mt-3 p-3 bg-purple-50 dark:bg-purple-900/20 rounded-lg border border-purple-200 dark:border-purple-800 space-y-2">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-purple-700 dark:text-purple-300">Column Filters — include or exclude by field</span>
          <button @click="clearColumnFilters()"
                  class="px-3 py-1 text-[10px] font-bold rounded bg-red-100 dark:bg-red-900 text-red-600 dark:text-red-300 hover:bg-red-200 transition-colors">Clear All</button>
        </div>

        <template x-for="(cf, fi) in columnFilters" :key="fi">
          <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
            <select x-model="columnFilters[fi].column"
                    class="text-xs border border-purple-300 dark:border-purple-600 rounded px-2 py-1.5 bg-white dark:bg-gray-800 outline-none min-w-[80px]">
              <option value="title">Title</option>
              <option value="source_name">Source</option>
              <option value="tags">Tag</option>
              <option value="published">Date</option>
              <option value="tldr">TLDR</option>
            </select>
            <select x-model="columnFilters[fi].operator"
                    class="text-xs border border-purple-300 dark:border-purple-600 rounded px-2 py-1.5 bg-white dark:bg-gray-800 outline-none min-w-[90px]">
              <option value="contains">contains</option>
              <option value="equals">equals</option>
              <option value="starts_with">starts with</option>
              <option value="ends_with">ends with</option>
              <option value="not_contains">not contains</option>
              <option value="regex">regex</option>
            </select>
            <button @click="columnFilters[fi].mode = columnFilters[fi].mode === 'include' ? 'exclude' : 'include'"
                    :class="columnFilters[fi].mode === 'include' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'"
                    class="px-2.5 py-1.5 text-[10px] font-bold rounded transition-colors min-w-[70px]"
                    x-text="columnFilters[fi].mode === 'include' ? 'INCLUDE' : 'EXCLUDE'"></button>
            <input x-model="columnFilters[fi].value"
                   placeholder="Type filter value..."
                   class="flex-1 text-xs border border-purple-300 dark:border-purple-600 rounded px-2 py-1.5 bg-white dark:bg-gray-800 outline-none min-w-[120px]">
            <button @click="removeColumnFilter(fi)"
                    class="p-1 text-gray-400 hover:text-red-500 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </template>

        <button @click="addColumnFilter()"
                class="flex items-center gap-1 text-xs text-purple-600 dark:text-purple-400 hover:text-purple-800 font-medium mt-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          Add filter
        </button>
      </div>

      <!-- Advanced Search Builder -->
      <div x-show="showAdvanced" x-transition class="mt-3 p-3 bg-gray-50 dark:bg-gray-800/50 rounded-lg border border-gray-200 dark:border-gray-700 space-y-2">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-gray-600 dark:text-gray-300">Match</span>
            <button @click="advancedLogic = 'AND'"
                    :class="advancedLogic === 'AND' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400'"
                    class="px-2.5 py-1 text-[10px] font-bold rounded transition-colors">AND</button>
            <button @click="advancedLogic = 'OR'"
                    :class="advancedLogic === 'OR' ? 'bg-blue-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400'"
                    class="px-2.5 py-1 text-[10px] font-bold rounded transition-colors">OR</button>
            <span class="text-[10px] text-gray-400">of the following</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button @click="applyAdvancedSearch()"
                    class="px-3 py-1 text-[10px] font-bold rounded bg-green-500 text-white hover:bg-green-600 transition-colors">Apply</button>
            <button @click="clearAdvancedSearch()"
                    class="px-3 py-1 text-[10px] font-bold rounded bg-red-100 dark:bg-red-900 text-red-600 dark:text-red-300 hover:bg-red-200 transition-colors">Clear</button>
          </div>
        </div>

        <template x-for="(cond, ci) in advancedConditions" :key="ci">
          <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
            <select x-model="advancedConditions[ci].field"
                    class="text-xs border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 bg-white dark:bg-gray-800 outline-none min-w-[80px]">
              <option value="any">Any field</option>
              <option value="title">Title</option>
              <option value="tldr">TLDR</option>
              <option value="source">Source</option>
              <option value="tag">Tag</option>
              <option value="date">Date</option>
            </select>
            <select x-model="advancedConditions[ci].operator"
                    class="text-xs border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 bg-white dark:bg-gray-800 outline-none min-w-[90px]">
              <option value="contains">contains</option>
              <option value="equals">equals</option>
              <option value="starts_with">starts with</option>
              <option value="ends_with">ends with</option>
              <option value="not_contains">not contains</option>
              <option value="regex">regex</option>
            </select>
            <button @click="advancedConditions[ci].negate = !advancedConditions[ci].negate"
                    :class="advancedConditions[ci].negate ? 'bg-red-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-500'"
                    class="px-2 py-1.5 text-[10px] font-bold rounded transition-colors min-w-[40px]"
                    x-text="advancedConditions[ci].negate ? 'NOT' : 'IS'"></button>
            <input x-model="advancedConditions[ci].value"
                   @keydown.enter="applyAdvancedSearch()"
                   :placeholder="advancedConditions[ci].field === 'tag' ? '#new, #security...' : 'Type to search...'"
                   class="flex-1 text-xs border border-gray-300 dark:border-gray-600 rounded px-2 py-1.5 bg-white dark:bg-gray-800 outline-none min-w-[120px]">
            <button @click="removeCondition(ci)"
                    class="p-1 text-gray-400 hover:text-red-500 transition-colors"
                    title="Remove condition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </template>

        <button @click="addCondition()"
                class="flex items-center gap-1 text-xs text-blue-500 hover:text-blue-700 font-medium mt-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          Add condition
        </button>

        <div x-show="useAdvancedSearch" class="mt-2 text-[10px] text-blue-500 font-medium flex items-center gap-1">
          <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
          Advanced search active
        </div>
      </div>
    </div>
  </div>

  <!-- Body: Left Sidebar + Content -->
  <div class="flex-1 flex">

    <!-- Mobile overlay when sidebar open -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false"
         class="lg:hidden fixed inset-0 bg-black/30 z-40 transition-opacity"
         x-transition:enter="ease-out duration-200" x-transition:leave="ease-in duration-150"></div>

    <!-- LEFT Sidebar — slides over on mobile, inline on desktop -->
    <aside :class="sidebarOpen ? 'w-60 translate-x-0' : 'w-0 -translate-x-full lg:translate-x-0'"
           class="flex-shrink-0 transition-all duration-300 ease-in-out overflow-hidden bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800
                  fixed lg:relative lg:sticky top-0 lg:top-[105px] h-full lg:h-[calc(100vh-105px-49px)] z-50 lg:z-auto">

      <div class="w-60 overflow-y-auto h-full p-4 space-y-1">

        <!-- Close sidebar arrow -->
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Navigation</span>
          <button @click="sidebarOpen = false"
                  class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
                  title="Close sidebar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
            </svg>
          </button>
        </div>

        <!-- Products group -->
        <div>
          <button @click="expandProducts = !expandProducts"
                  class="flex items-center justify-between w-full px-2 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors group">
            <span class="text-[11px] font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 group-hover:text-gray-600 dark:group-hover:text-gray-300">Products</span>
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] text-gray-400" x-text="tabs.filter(function(t){return t.group==='products' && !t.parentId}).length"></span>
              <svg :class="expandProducts ? 'rotate-180' : ''" class="w-3.5 h-3.5 text-gray-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </button>
          <div x-show="expandProducts" x-collapse class="mt-1 space-y-0.5">
            <template x-for="tab in tabs.filter(function(t){return t.group === 'products' && !t.parentId})" :key="tab.id">
              <div>
                <div class="flex items-center">
                  <button :id="'tab-' + tab.id" @click="setTab(tab.id)"
                          :class="activeTab === tab.id
                            ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border-l-2 border-blue-500'
                            : 'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 border-l-2 border-transparent'"
                          class="flex-1 flex items-center justify-between px-3 py-2 text-sm rounded-r-lg transition-all duration-150">
                    <div class="flex items-center gap-2 min-w-0">
                      <span x-text="tab.icon" class="text-base flex-shrink-0"></span>
                      <span x-text="tab.label" class="truncate font-medium"></span>
                    </div>
                    <span class="text-[10px] ml-2 flex-shrink-0 tabular-nums"
                          :class="activeTab === tab.id ? 'text-blue-500 dark:text-blue-400 font-semibold' : 'text-gray-400 dark:text-gray-600'"
                          x-text="tabCounts[tab.id] || 0"></span>
                  </button>
                  <!-- Expand arrow for items with children -->
                  <button x-show="tab.children && tab.children.length > 0"
                          @click.stop="tab._expanded = !tab._expanded"
                          class="p-1.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                    <svg :class="tab._expanded ? 'rotate-180' : ''" class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                  </button>
                </div>
                <!-- Children (e.g., Terraform Providers) -->
                <div x-show="tab._expanded && tab.children && tab.children.length > 0" x-collapse class="ml-6 space-y-0.5 mt-0.5">
                  <template x-for="child in tab.children" :key="child.id">
                    <button :id="'tab-' + child.id" @click="setTab(child.id)"
                            :class="activeTab === child.id
                              ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border-l-2 border-blue-500'
                              : 'text-gray-500 dark:text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-800 border-l-2 border-transparent'"
                            class="flex items-center justify-between w-full px-2 py-1.5 text-xs rounded-r-lg transition-all duration-150">
                      <div class="flex items-center gap-1.5 min-w-0">
                        <span x-text="child.icon" class="text-sm flex-shrink-0"></span>
                        <span x-text="child.label" class="truncate"></span>
                      </div>
                      <span class="text-[9px] ml-1 flex-shrink-0 tabular-nums text-gray-400"
                            x-text="tabCounts[child.id] || 0"></span>
                    </button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-800 my-2"></div>

        <!-- Topics group -->
        <div>
          <button @click="expandTopics = !expandTopics"
                  class="flex items-center justify-between w-full px-2 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors group">
            <span class="text-[11px] font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 group-hover:text-gray-600 dark:group-hover:text-gray-300">Topics</span>
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] text-gray-400" x-text="tabs.filter(function(t){return t.group==='topics'}).length"></span>
              <svg :class="expandTopics ? 'rotate-180' : ''" class="w-3.5 h-3.5 text-gray-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </button>
          <div x-show="expandTopics" x-collapse class="mt-1 space-y-0.5">
            <template x-for="tab in tabs.filter(function(t){return t.group === 'topics'})" :key="tab.id">
              <button :id="'tab-' + tab.id" @click="setTab(tab.id)"
                      :class="activeTab === tab.id
                        ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border-l-2 border-blue-500'
                        : 'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 border-l-2 border-transparent'"
                      class="flex items-center justify-between w-full px-3 py-2 text-sm rounded-r-lg transition-all duration-150">
                <div class="flex items-center gap-2 min-w-0">
                  <span x-text="tab.icon" class="text-base flex-shrink-0"></span>
                  <span x-text="tab.label" class="truncate font-medium"></span>
                </div>
                <span class="text-[10px] ml-2 flex-shrink-0 tabular-nums"
                      :class="activeTab === tab.id ? 'text-blue-500 dark:text-blue-400 font-semibold' : 'text-gray-400 dark:text-gray-600'"
                      x-text="tabCounts[tab.id] || 0"></span>
              </button>
            </template>
          </div>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-800 my-2"></div>

        <!-- Software group -->
        <div>
          <button @click="expandSoftware = !expandSoftware"
                  class="flex items-center justify-between w-full px-2 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors group">
            <span class="text-[11px] font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 group-hover:text-gray-600 dark:group-hover:text-gray-300">Software</span>
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] text-gray-400" x-text="tabs.filter(function(t){return t.group==='software' && !t.parentId}).length"></span>
              <svg :class="expandSoftware ? 'rotate-180' : ''" class="w-3.5 h-3.5 text-gray-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </button>
          <div x-show="expandSoftware" x-collapse class="mt-1 space-y-0.5">
            <template x-for="tab in tabs.filter(function(t){return t.group === 'software' && !t.parentId})" :key="tab.id">
              <button :id="'tab-' + tab.id" @click="setTab(tab.id)"
                      :class="activeTab === tab.id
                        ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border-l-2 border-blue-500'
                        : 'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 border-l-2 border-transparent'"
                      class="flex items-center justify-between w-full px-3 py-2 text-sm rounded-r-lg transition-all duration-150">
                <div class="flex items-center gap-2 min-w-0">
                  <span x-text="tab.icon" class="text-base flex-shrink-0"></span>
                  <span x-text="tab.label" class="truncate font-medium"></span>
                </div>
                <span class="text-[10px] ml-2 flex-shrink-0 tabular-nums"
                      :class="activeTab === tab.id ? 'text-blue-500 dark:text-blue-400 font-semibold' : 'text-gray-400 dark:text-gray-600'"
                      x-text="tabCounts[tab.id] || 0"></span>
              </button>
            </template>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content (shifts with sidebar) -->
    <main class="flex-1 min-w-0 px-4 py-4 transition-all duration-300 ease-in-out">

      <!-- Loading -->
      <div x-show="loading" class="flex items-center justify-center py-20">
        <div class="animate-spin w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full"></div>
        <span class="ml-3 text-gray-500">Loading data...</span>
      </div>

      <!-- Error -->
      <div x-show="error && !loading" class="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded-lg p-6 text-center">
        <p class="text-yellow-700 dark:text-yellow-300 font-medium" x-text="error"></p>
        <p class="text-sm text-yellow-600 dark:text-yellow-400 mt-2">
          Run <code class="bg-yellow-100 dark:bg-yellow-900 px-1.5 py-0.5 rounded">cd scripts && node collect.js && node build.js</code>
        </p>
      </div>

      <!-- Empty -->
      <div x-show="!loading && !error && filteredItems.length === 0" class="text-center py-20">
        <div class="text-4xl mb-3">📭</div>
        <p class="text-gray-500 dark:text-gray-400 font-medium">No items found</p>
        <p class="text-sm text-gray-400 dark:text-gray-500 mt-1">Try adjusting your search or date filters</p>
      </div>

      <!-- Data Table (desktop) — resizable columns, text wraps to fit -->
      <div x-show="!loading && !error && filteredItems.length > 0" class="hidden md:block">
        <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden shadow-sm">
          <div class="overflow-auto max-h-[calc(100vh-280px)]">
            <table class="text-sm border-collapse" id="news-table" :style="'table-layout:fixed; width:' + totalTableWidth() + 'px'">
              <colgroup>
                <template x-for="col in columnOrder" :key="col">
                  <col :style="'width:' + colWidths[col] + 'px'">
                </template>
              </colgroup>
              <thead class="sticky top-0 z-20">
                <tr class="border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-950">
                  <template x-for="(col, ci) in columnOrder" :key="col">
                    <th class="relative px-4 py-3 text-left font-semibold text-gray-600 dark:text-gray-400 select-none overflow-hidden"
                        :style="'width:' + colWidths[col] + 'px'">
                      <!-- Header label + sort (clicking the label sorts) -->
                      <span class="inline-flex items-center gap-1 cursor-pointer hover:text-gray-900 dark:hover:text-gray-200"
                            @click="setSort(colDefs[col].sortKey || col)">
                        <span x-text="colDefs[col].label"></span>
                        <span x-show="sortColumn === (colDefs[col].sortKey || col)" x-text="sortDirection === 'asc' ? '↑' : '↓'" class="text-blue-500"></span>
                      </span>
                      <!-- Resize handle on right edge -->
                      <div class="col-resize-handle absolute top-0 right-0 w-[5px] h-full cursor-col-resize z-10 group/resize hover:bg-blue-400/40"
                           @mousedown.prevent.stop="startResize($event, col)">
                        <div class="w-px h-full mx-auto bg-gray-300 dark:bg-gray-700 group-hover/resize:bg-blue-500 transition-colors"></div>
                      </div>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="(item, idx) in filteredItems" :key="item.id">
                  <tr :class="idx % 2 === 0 ? 'bg-white dark:bg-gray-900' : 'bg-gray-50/50 dark:bg-gray-950/50'"
                      class="border-b border-gray-100 dark:border-gray-800/50 hover:bg-blue-50/50 dark:hover:bg-blue-900/10 transition-colors">
                    <template x-for="col in columnOrder" :key="col">
                      <td class="px-4 py-3 align-top overflow-hidden text-sm"
                          :style="'width:' + colWidths[col] + 'px'">
                        <!-- Date -->
                        <template x-if="col === 'date'">
                          <span class="text-gray-500 dark:text-gray-400 text-xs break-words" x-text="formatDate(item.published)"></span>
                        </template>
                        <!-- Title -->
                        <template x-if="col === 'title'">
                          <a :href="item.url" target="_blank" rel="noopener noreferrer"
                             class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 hover:underline font-medium break-words"
                             x-text="item.title"></a>
                        </template>
                        <!-- Version -->
                        <template x-if="col === 'version'">
                          <span x-show="item.version"
                                class="inline-flex items-center px-1.5 py-0.5 text-[10px] font-mono font-semibold rounded bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 break-words"
                                x-text="item.version"></span>
                        </template>
                        <!-- Source -->
                        <template x-if="col === 'source'">
                          <span class="text-gray-600 dark:text-gray-400 text-xs break-words" x-text="item.source_name"></span>
                        </template>
                        <!-- TLDR — click to expand/collapse -->
                        <template x-if="col === 'tldr'">
                          <div class="text-gray-600 dark:text-gray-400 text-xs break-words">
                            <div @click="item._expanded = !item._expanded" class="cursor-pointer">
                              <span x-show="!item._expanded" class="line-clamp-2" x-text="item.tldr"></span>
                              <span x-show="item._expanded" x-text="item.tldr"></span>
                              <span x-show="item.tldr && item.tldr.length > 60"
                                    class="text-blue-500 hover:text-blue-700 ml-1 inline-block text-[10px] font-medium select-none"
                                    x-text="item._expanded ? '▲ less' : '▼ more'"></span>
                            </div>
                          </div>
                        </template>
                        <!-- Tags -->
                        <template x-if="col === 'tags'">
                          <div class="flex flex-wrap gap-1">
                            <template x-for="tag in item.tags.filter(function(t){return t.startsWith('#')})" :key="tag">
                              <span :class="getTagStyle(tag).bg + ' ' + getTagStyle(tag).text"
                                    class="inline-flex items-center gap-0.5 px-1.5 py-0.5 text-[10px] font-medium rounded-full cursor-pointer whitespace-nowrap"
                                    @click="searchQuery = tag; updateUrl()"
                                    x-text="getTagStyle(tag).emoji + ' ' + tag"></span>
                            </template>
                          </div>
                        </template>
                        <!-- Views -->
                        <template x-if="col === 'views'">
                          <span class="text-gray-500 dark:text-gray-400 text-xs block text-right" x-text="formatViews(item.views)"></span>
                        </template>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
        <!-- Reset columns button -->
        <div class="mt-2 text-right">
          <button @click="resetColWidths()" class="text-[10px] text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
            Reset column widths
          </button>
        </div>
      </div>

      <!-- Card View (mobile) -->
      <div x-show="!loading && !error && filteredItems.length > 0" class="md:hidden space-y-3">
        <template x-for="item in filteredItems" :key="item.id">
          <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 shadow-sm">
            <div class="flex items-start justify-between gap-2 mb-2">
              <a :href="item.url" target="_blank" rel="noopener noreferrer"
                 class="text-blue-600 dark:text-blue-400 hover:underline font-medium text-sm leading-snug flex-1"
                 x-text="item.title"></a>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <span x-show="item.version"
                      class="px-1.5 py-0.5 text-[9px] font-mono font-semibold rounded bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300"
                      x-text="item.version"></span>
                <span class="text-[10px] text-gray-400 whitespace-nowrap" x-text="formatDate(item.published)"></span>
              </div>
            </div>
            <!-- Full TLDR on mobile -->
            <div @click="item._expanded = !item._expanded" class="cursor-pointer mb-2">
              <p class="text-xs text-gray-500 dark:text-gray-400" :class="item._expanded ? '' : 'line-clamp-2'" x-text="item.tldr"></p>
              <span x-show="item.tldr && item.tldr.length > 80"
                    class="text-blue-500 text-[10px] font-medium"
                    x-text="item._expanded ? '▲ less' : '▼ more'"></span>
            </div>
            <div class="flex items-center justify-between">
              <div class="flex flex-wrap gap-1">
                <template x-for="tag in item.tags.filter(function(t){return t.startsWith('#')})" :key="tag">
                  <span :class="getTagStyle(tag).bg + ' ' + getTagStyle(tag).text"
                        class="inline-flex items-center gap-0.5 px-1.5 py-0.5 text-[10px] font-medium rounded-full"
                        x-text="getTagStyle(tag).emoji + ' ' + tag"></span>
                </template>
              </div>
              <div class="flex items-center gap-2 text-[10px] text-gray-400">
                <span x-text="item.source_name"></span>
                <span x-show="item.views" x-text="formatViews(item.views) + ' views'"></span>
              </div>
            </div>
          </div>
        </template>
      </div>
    </main>
  </div>

  <!-- Footer / Export Bar -->
  <footer class="bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 sticky bottom-0 z-40">
    <div class="mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400">Export:</span>
        <button @click="doExportCSV()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300 hover:bg-green-200 dark:hover:bg-green-800 transition-colors">CSV</button>
        <button @click="doExportJSON()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors">JSON</button>
        <button @click="doExportPDF()" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300 hover:bg-red-200 dark:hover:bg-red-800 transition-colors">PDF</button>
      </div>
      <div class="text-xs text-gray-400 dark:text-gray-600">
        <a href="https://github.com/h3nryza/Tech-Update" target="_blank" rel="noopener noreferrer" class="hover:text-gray-600 dark:hover:text-gray-400">h3nryza/Tech-Update</a>
      </div>
    </div>
  </footer>

</div>
</body>
</html>
